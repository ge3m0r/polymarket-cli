name: Tokyo weather paper signal

on:
  schedule:
    # 09:17 in Tokyo on the day before settlement. Avoid the start-of-hour load peak.
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: tokyo-weather-paper-signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build paper-trading CLI
        run: cargo build --release --locked

      - name: Restore forward paper ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p paper-signals/open paper-signals/settled run-output
          artifact_url="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "${{ github.api_url }}/repos/${{ github.repository }}/actions/artifacts?name=tokyo-weather-paper-ledger&per_page=100" \
              | jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .archive_download_url // empty'
          )"
          if [ -n "$artifact_url" ]; then
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$artifact_url" --output /tmp/tokyo-weather-paper-ledger.zip
            unzip -o -q /tmp/tokyo-weather-paper-ledger.zip -d paper-signals
          fi

      - name: Settle saved entry snapshots
        run: |
          mkdir -p paper-signals/open paper-signals/settled run-output
          shopt -s nullglob
          for signal in paper-signals/open/*.json; do
            target="$(jq -r '.target_date' "$signal")"
            settlement="run-output/tokyo-${target}-settlement.json"
            target/release/polymarket --output json \
              weather settle-tokyo-paper --signal "$signal" > "$settlement"
            if [ "$(jq -r '.status' "$settlement")" = "SETTLED" ]; then
              cp "$settlement" "paper-signals/settled/tokyo-${target}.json"
              rm "$signal"
            else
              rm "$settlement"
            fi
          done

      - name: Generate paper signal
        run: |
          report="run-output/tokyo-signal.json"
          target/release/polymarket \
            --output json \
            weather signal-tokyo \
            --legacy-weight 0.75 \
            --size 5 \
            --slippage 0.01 \
            --min-expected-pnl 1.5 \
            --max-entry-delay-minutes 15 \
            > "$report"
          target="$(jq -r '.target_date' "$report")"
          if [ "$(jq -r '.entry_timing' "$report")" = "ON_TIME" ]; then
            cp "$report" "paper-signals/open/tokyo-${target}.json"
          fi

      - name: Update ledger metadata
        run: |
          jq -n \
            --arg updated_at "$(date -u +%FT%TZ)" \
            --arg run_id "${{ github.run_id }}" \
            '{format_version: 1, updated_at: $updated_at, run_id: $run_id}' \
            > paper-signals/ledger.json

      - name: Write run summary
        run: |
          report="run-output/tokyo-signal.json"
          {
            echo "## Tokyo weather paper signal"
            echo
            echo "- Target date: $(jq -r '.target_date' "$report")"
            echo "- Scheduled entry: $(jq -r '.scheduled_entry_time_utc' "$report")"
            echo "- Quote captured: $(jq -r '.quote_time_utc' "$report")"
            echo "- Entry delay: $(jq -r '.entry_delay_seconds' "$report") seconds"
            echo "- Entry timing: **$(jq -r '.entry_timing' "$report")**"
            echo "- Action: **$(jq -r '.action' "$report")**"
            echo "- Legacy band: $(jq -r '.legacy_band | join(" / ")' "$report")"
            echo "- Optimized band: $(jq -r '.optimized_band | join(" / ")' "$report")"
            echo "- Blended coverage: $(jq -r '.blended_coverage * 100 | tostring' "$report")%"
            echo "- Conservative cost: $(jq -r '.conservative_total_cost' "$report") USDC"
            echo "- Conservative expected P&L: $(jq -r '.conservative_expected_pnl' "$report") USDC"
            echo
            echo "Simulation only. No wallet is configured and no order is placed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload paper signal
        uses: actions/upload-artifact@v4
        with:
          name: tokyo-weather-paper-signal-${{ github.run_number }}
          path: run-output/*.json
          retention-days: 90
          if-no-files-found: error

      - name: Save forward paper ledger
        uses: actions/upload-artifact@v4
        with:
          name: tokyo-weather-paper-ledger
          path: paper-signals
          retention-days: 90
          if-no-files-found: error
